name: Deploy chat-app to Fly.io

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | FLYCTL_INSTALL=$HOME/.fly sh
          echo "$HOME/.fly/bin" >> $GITHUB_PATH

      - name: Deploy chat-app to Fly (remote build)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: ./chat-app
        run: |
          # Deploy from the chat-app directory so Fly uses its code as the app
          flyctl deploy --remote-only
